[package]
name = "hyrax"
version = "0.1.0"
description = "Cliente de escritorio para PostgreSQL"
license = "MIT"
edition = "2021"

[lib]
name = "hyrax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs", "io-util"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
futures-util = "0.3"
tauri-plugin-dialog = "2"
keyring = "4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
